<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — tracks what matters</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-dark: #4038c9;
    --accent-soft: #eceafe;
    --ink: #0c0c14;
    --muted: #5b6070;
    --line: #e7e8ef;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 560px at 88% -12%, #e8e5ff 0%, rgba(232, 229, 255, 0) 62%),
      radial-gradient(820px 480px at -12% 112%, #e6f3ff 0%, rgba(230, 243, 255, 0) 58%),
      #ffffff;
    background-attachment: fixed;
  }

  .hero {
    max-width: 1120px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100svh;
    padding: 96px 32px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    gap: 64px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 24px;
    padding: 8px 16px 8px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .eyebrow svg { width: 16px; height: 16px; flex: none; }

  h1 {
    margin: 0 0 24px;
    font-size: clamp(2.5rem, 6vw, 3.75rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.032em;
    max-width: 14ch;
  }

  h1 .accent { color: var(--accent); }

  .lede {
    margin: 0 0 40px;
    max-width: 42ch;
    font-size: 1.0625rem;
    line-height: 1.65;
    color: var(--muted);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 24px;
    border-radius: 12px;
    background: var(--accent);
    color: #ffffff;
    font-size: 0.9375rem;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 12px 28px -12px rgba(79, 70, 229, 0.7);
    transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
  }

  .cta:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
    box-shadow: 0 16px 32px -12px rgba(79, 70, 229, 0.75);
  }

  .cta:focus-visible {
    outline: 2px solid var(--accent-dark);
    outline-offset: 3px;
  }

  .cta svg { width: 18px; height: 18px; flex: none; }

  .visual {
    border: 1px solid var(--line);
    border-radius: 24px;
    background:
      radial-gradient(circle at 1px 1px, #dfe1ec 1px, transparent 1.5px) 0 0 / 20px 20px,
      #ffffff;
    padding: 32px;
    box-shadow: 0 32px 64px -32px rgba(16, 18, 40, 0.28);
  }

  .visual svg { display: block; width: 100%; height: auto; }

  .visual__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent-dark);
  }

  .live::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  @media (max-width: 640px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 56px 20px;
      min-height: 0;
      align-items: start;
    }

    h1 { max-width: none; }
    .lede { margin-bottom: 32px; }
    .visual { padding: 24px; border-radius: 20px; }
  }
</style>
</head>
<body>

  <main class="hero">
    <div class="hero__copy">
      <p class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h4l3-8 4 16 3-8h4"/>
        </svg>
        Live signal tracking
      </p>

      <h1>Pulse tracks <span class="accent">what matters</span></h1>

      <p class="lede">
        Pulse watches your product's vital signs — signups, latency, churn, revenue — and surfaces
        the shifts that actually mean something, the moment they happen. No dashboards to babysit,
        no noise to sift through.
      </p>

      <a class="cta" href="#">
        Start tracking
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m13 6 6 6-6 6"/>
        </svg>
      </a>
    </div>

    <div class="visual" aria-hidden="true">
      <svg viewBox="0 0 320 140">
        <path
          d="M8 96 H64 L80 46 L98 138 L116 68 L132 96 H164 L178 76 L192 96 H312"
          fill="none"
          stroke="#4f46e5"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>
      <div class="visual__meta">
        <span>Signal</span>
        <span class="live">Live</span>
      </div>
    </div>
  </main>

</body>
</html>
